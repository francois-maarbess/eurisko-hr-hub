name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Configure environment
        run: cp .env.example .env

      - name: Set up database
        run: npm run db:reset

      - name: Typecheck backend
        run: npx tsc --noEmit

      - name: Lint backend
        run: npm run lint

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Audit report (advisory, high+)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit gate (critical only)
        run: npm audit --audit-level=critical

      - name: Run tests (132, SQLite)
        run: npm test

      - name: Run frontend tests (vitest)
        run: npm test
        working-directory: frontend

      - name: Verify README test counts
        run: npm run test:count -- --check

      - name: AI evals (9, offline)
        run: npm run eval:ai

      - name: Build backend
        run: npm run build

      - name: Build frontend
        run: npm run build
        working-directory: frontend
