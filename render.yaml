# Render blueprint: backend API + frontend static site, free tier, SQLite.
# Apply once from the dashboard (Blueprints → New → this repo). Secrets marked
# `sync: false` prompt for values; nothing secret is committed here.

services:
  - type: web
    name: eurisko-hr-hub
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install --include=dev; npx prisma generate; npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npx tsx prisma/seed.ts && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY
        value: 1

  - type: web
    name: eurisko-hr-hub-app
    runtime: static
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: npm install; npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        sync: false
